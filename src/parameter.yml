# fabric-cicd parameterization: swaps environment-specific values in the item
# definitions at deploy time. Environment keys must match the FABRIC_ENV
# variable on each GitHub environment (DEV / QA / PROD).
#
# Mirrors Newmont's pattern: Dev/QA -> Databricks test catalog, Prod -> production catalog.
# In this POC each "catalog" is a separate Azure SQL database (newmont_test / newmont_prod)
# and the schema is "gold" in both.

find_replace:
  - find_value: 'expression CatalogName = "newmont_test"'
    replace_value:
      DEV: 'expression CatalogName = "newmont_test"'
      QA: 'expression CatalogName = "newmont_test"'
      PROD: 'expression CatalogName = "newmont_prod"'
    item_type: "SemanticModel"
    item_name: "NewmontProduction"

  - find_value: 'expression SchemaName = "gold"'
    replace_value:
      DEV: 'expression SchemaName = "gold"'
      QA: 'expression SchemaName = "gold"'
      PROD: 'expression SchemaName = "gold"'
    item_type: "SemanticModel"
    item_name: "NewmontProduction"
